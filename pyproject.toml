[project]
name = "asana-api-cli"
version = "3.3.1"
description = "Command-line wrapper around the official Asana Python SDK"
authors = [{name = "Masanao Izumo"}]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["asana", "cli", "python-asana"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Groupware",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.0",
    "jq>=1.6",
    "tabulate>=0.9",
    "asana>=5.0.2,<6",
]

[project.urls]
Homepage = "https://github.com/izumo-m/asana-api-cli"
Repository = "https://github.com/izumo-m/asana-api-cli"
Issues = "https://github.com/izumo-m/asana-api-cli/issues"
Changelog = "https://github.com/izumo-m/asana-api-cli/blob/main/CHANGELOG.md"

[project.scripts]
asana-api = "asana_api_cli.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.15",
    "basedpyright>=1.39",
    "pytest>=9,<10",
    "build>=1.5,<2",
    "twine>=6.2,<7",
    "vermin>=1.8,<2",
    "vcrpy>=8",
    "pytest-recording>=0.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
# Generated python-asana scripts pinned as golden snapshots; they use repr/pprint
# literal style and are validated by ``compile()`` in the snapshot test, not by
# this project's lint config.
extend-exclude = ["tests/fixtures/generate_python"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"
# Markdown code blocks are transcripts (the README's python block mirrors
# --generate-python output verbatim, single quotes included) — keep the
# formatter (a Markdown formatter since ruff 0.16) away from them.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "B", "ISC", "G", "SIM", "Q"]
ignore = ["SIM102"]
unfixable = ["F401"]          # do not auto-fix unused imports

[tool.ruff.lint.isort]
sections.tests = ["tests", "tests.*"]
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "tests",
  "local-folder"
]

[tool.vermin]
target = "3.10"
violations = true
backport = [
    "typing_extensions",
    "typing",
    "dataclasses",
    "asyncio",
    "argparse",
    "enum",
    "importlib",
    "zoneinfo"
]
no_parse_comments = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ""
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true
