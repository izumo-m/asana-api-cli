[project]
name = "asana-api-cli"
version = "1.3.0"
description = "Command-line wrapper around the official Asana Python SDK"
authors = [{name = "Masanao Izumo", email = "asana@masanao.site"}]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1,<9",
    "jq>=1.8,<2",
    "tabulate>=0.9,<1",
    "asana>=5.2.4,<6",
]

[project.urls]
Homepage = "https://github.com/izumo-m/asana-api-cli"
Repository = "https://github.com/izumo-m/asana-api-cli"
Issues = "https://github.com/izumo-m/asana-api-cli/issues"

[project.scripts]
asana-api = "asana_api_cli.cli:main"

[dependency-groups]
dev = [
    "ruff<1",
    "pytest>=9,<10",
    "build>=1,<2",
    "twine>=6,<7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["src/asana_api_cli/cli"]  # auto-generated (tools/codegen.py)

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "W", "N", "B", "ISC", "G", "SIM", "Q"]
ignore = ["SIM102"]
unfixable = ["F401"]          # do not auto-fix unused imports

[tool.ruff.lint.isort]
sections.tests = ["tests", "tests.*"]
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "tests",
  "local-folder"
]

[tool.vermin]
target = "3.10"
violations = true
backport = [
    "typing_extensions",
    "typing",
    "dataclasses",
    "asyncio",
    "argparse",
    "enum",
    "importlib",
    "zoneinfo"
]
no_parse_comments = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ""
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true
